[package]
name = "arko_studio"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "The desktop app of the arko agent"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mesa-hills-research/arko_studio"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "arko-studio"
path = "src/main.rs"

[dependencies]
# GPUI Kit from Mesa Hills Research's fork. It pins the matching gpui-pre release
# and re-exports it, so GPUI is `gpui_kit::*` and needs no entry of its own.
gpui-kit = { git = "https://github.com/mesa-hills-research/gpui_kit", rev = "eb902b7a2aad7a5cd184e4597c68e008b2dab5cb", features = ["fonts", "tree-sitter-languages", "writing"] }
# Arko's engine, as a library: no terminal crates, the web page's server kept.
arko = { package = "arko-tui", version = "0.1.0", default-features = false, features = ["remote"] }
anyhow = "1.0"
# arko's Prompter trait is an async trait.
async-trait = "0.1"
chrono = "0.4"
# Lists an agent's folder for @-mentions as git sees it (.gitignore and the like).
ignore = "0.4"
# Parse fragment boundaries before joining replies in an export.
markdown = "1"
# The pixels of images the app draws itself (GPUI's own version, no codecs).
image = { version = "0.25", default-features = false }
# The web page's QR code, drawn with whole device pixels a module (arko's QR crate).
qrcodegen = "1.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# The same GPUI Kit with GPUI's test harness, for tests that click and type
# into real windows on a fake clock.
gpui-kit = { git = "https://github.com/mesa-hills-research/gpui_kit", rev = "eb902b7a2aad7a5cd184e4597c68e008b2dab5cb", features = ["test-support"] }
arko = { package = "arko-tui", version = "0.1.0", default-features = false, features = ["remote", "testing"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
# The feed's events as arko gets them from the framework, for tests that
# drive a feed the way a session does.
arko_agents = "0.1.0"
arko_workflows = "0.1.0"
uuid = "1"

# The golden-screenshot harness, from the gpui fork at the rev of the [patch.crates-io] below.
# Its goldens are drawn by Mesa's software Vulkan driver, on Linux.
[target.'cfg(target_os = "linux")'.dev-dependencies]
gpui-screenshot = { package = "gpui-pre-screenshot", git = "https://github.com/mesa-hills-research/gpui", rev = "c2afdb370ee2041147b65f4e3bff15a18cc2c075" }

[build-dependencies]
winresource = "0.1"

# GPUI from Mesa Hills Research's fork, at the commit GPUI Kit builds with. Cargo applies
# only the app's own patches, so the kit's patch doesn't reach the app. Move the rev with
# the kit's.
[patch.crates-io]
gpui-pre                   = { git = "https://github.com/mesa-hills-research/gpui", rev = "c2afdb370ee2041147b65f4e3bff15a18cc2c075" }
gpui-pre-apple             = { git = "https://github.com/mesa-hills-research/gpui", rev = "c2afdb370ee2041147b65f4e3bff15a18cc2c075" }
gpui-pre-collections       = { git = "https://github.com/mesa-hills-research/gpui", rev = "c2afdb370ee2041147b65f4e3bff15a18cc2c075" }
gpui-pre-derive-refineable = { git = "https://github.com/mesa-hills-research/gpui", rev = "c2afdb370ee2041147b65f4e3bff15a18cc2c075" }
gpui-pre-http-client       = { git = "https://github.com/mesa-hills-research/gpui", rev = "c2afdb370ee2041147b65f4e3bff15a18cc2c075" }
gpui-pre-linux             = { git = "https://github.com/mesa-hills-research/gpui", rev = "c2afdb370ee2041147b65f4e3bff15a18cc2c075" }
gpui-pre-macos             = { git = "https://github.com/mesa-hills-research/gpui", rev = "c2afdb370ee2041147b65f4e3bff15a18cc2c075" }
gpui-pre-macros            = { git = "https://github.com/mesa-hills-research/gpui", rev = "c2afdb370ee2041147b65f4e3bff15a18cc2c075" }
gpui-pre-perf              = { git = "https://github.com/mesa-hills-research/gpui", rev = "c2afdb370ee2041147b65f4e3bff15a18cc2c075" }
gpui-pre-platform          = { git = "https://github.com/mesa-hills-research/gpui", rev = "c2afdb370ee2041147b65f4e3bff15a18cc2c075" }
gpui-pre-refineable        = { git = "https://github.com/mesa-hills-research/gpui", rev = "c2afdb370ee2041147b65f4e3bff15a18cc2c075" }
gpui-pre-scheduler         = { git = "https://github.com/mesa-hills-research/gpui", rev = "c2afdb370ee2041147b65f4e3bff15a18cc2c075" }
gpui-pre-shared-string     = { git = "https://github.com/mesa-hills-research/gpui", rev = "c2afdb370ee2041147b65f4e3bff15a18cc2c075" }
gpui-pre-sum-tree          = { git = "https://github.com/mesa-hills-research/gpui", rev = "c2afdb370ee2041147b65f4e3bff15a18cc2c075" }
gpui-pre-util              = { git = "https://github.com/mesa-hills-research/gpui", rev = "c2afdb370ee2041147b65f4e3bff15a18cc2c075" }
gpui-pre-util-macros       = { git = "https://github.com/mesa-hills-research/gpui", rev = "c2afdb370ee2041147b65f4e3bff15a18cc2c075" }
gpui-pre-web               = { git = "https://github.com/mesa-hills-research/gpui", rev = "c2afdb370ee2041147b65f4e3bff15a18cc2c075" }
gpui-pre-wgpu              = { git = "https://github.com/mesa-hills-research/gpui", rev = "c2afdb370ee2041147b65f4e3bff15a18cc2c075" }
gpui-pre-windows           = { git = "https://github.com/mesa-hills-research/gpui", rev = "c2afdb370ee2041147b65f4e3bff15a18cc2c075" }
gpui-pre-zlog              = { git = "https://github.com/mesa-hills-research/gpui", rev = "c2afdb370ee2041147b65f4e3bff15a18cc2c075" }
gpui-pre-ztracing          = { git = "https://github.com/mesa-hills-research/gpui", rev = "c2afdb370ee2041147b65f4e3bff15a18cc2c075" }
gpui-pre-ztracing-macro    = { git = "https://github.com/mesa-hills-research/gpui", rev = "c2afdb370ee2041147b65f4e3bff15a18cc2c075" }

# Mesquite from crates.io for GPUI Kit too, the releases Arko's index uses, so the app
# builds and links one copy of each grammar. The kit pins the same code by git.
[patch."https://github.com/mesa-hills-research/mesquite"]
mesquite                   = "0.25.10"
mesquite_astro             = "0.1.0"
mesquite_bash              = "0.1.0"
mesquite_c                 = "0.1.0"
mesquite_cmake             = "0.1.0"
mesquite_cpp               = "0.1.0"
mesquite_c_sharp           = "0.1.0"
mesquite_css               = "0.1.0"
mesquite_dart              = "0.1.0"
mesquite_diff              = "0.1.0"
mesquite_dtd               = "0.1.0"
mesquite_elixir            = "0.1.0"
mesquite_elm               = "0.1.0"
mesquite_embedded_template = "0.1.0"
mesquite_erlang            = "0.1.0"
mesquite_fsharp            = "0.1.0"
mesquite_glsl              = "0.1.0"
mesquite_go                = "0.1.0"
mesquite_graphql           = "0.1.0"
mesquite_haskell           = "0.1.0"
mesquite_hcl               = "0.1.0"
mesquite_html              = "0.1.0"
mesquite_java              = "0.1.0"
mesquite_javascript        = "0.1.0"
mesquite_jsdoc             = "0.1.0"
mesquite_json              = "0.1.0"
mesquite_julia             = "0.1.0"
mesquite_kotlin            = "0.1.0"
mesquite_language          = "0.1.0"
mesquite_lua               = "0.1.0"
mesquite_make              = "0.1.0"
mesquite_markdown          = "0.1.0"
mesquite_markdown_inline   = "0.1.0"
mesquite_objc              = "0.1.0"
mesquite_ocaml             = "0.1.0"
mesquite_ocaml_interface   = "0.1.0"
mesquite_perl              = "0.1.0"
mesquite_php               = "0.1.0"
mesquite_php_only          = "0.1.0"
mesquite_powershell        = "0.1.0"
mesquite_proto             = "0.1.0"
mesquite_python            = "0.1.0"
mesquite_r                 = "0.1.0"
mesquite_ruby              = "0.1.0"
mesquite_rust              = "0.1.0"
mesquite_scala             = "0.1.0"
mesquite_sql               = "0.1.0"
mesquite_svelte            = "0.1.0"
mesquite_swift             = "0.1.0"
mesquite_toml              = "0.1.0"
mesquite_tsx               = "0.1.0"
