[package]
name = "arko_studio"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "The desktop app of the arko agent"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mesa-hills-research/arko_studio"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "arko-studio"
path = "src/main.rs"

[dependencies]
# GPUI Kit from Mesa Hills Research's fork. It pins the matching mhr-gpui release from
# crates.io and re-exports it, so GPUI is `gpui_kit::*` and needs no entry of its own.
gpui-kit = { git = "https://github.com/mesa-hills-research/gpui_kit", rev = "967d3871d8da17fa982d447b758a4af539bf0981", features = ["fonts", "tree-sitter-languages", "writing"] }
# Arko's engine, as a library: no terminal crates, the web page's server kept.
arko = { package = "arko-tui", version = "0.7.0", default-features = false, features = ["remote"] }
anyhow = "1.0"
# arko's Prompter trait is an async trait.
async-trait = "0.1"
# Find folds case in full (Unicode's case folding table).
caseless = "0.2.2"
chrono = "0.4"
# Lists an agent's folder for @-mentions as git sees it (.gitignore and the like).
ignore = "0.4"
# Parse fragment boundaries before joining replies in an export.
markdown = "1"
# The pixels of images the app draws itself, and the PNG of the window icon on Linux (GPUI's
# own version, with the PNG codec it already uses).
image = { version = "0.25", default-features = false, features = ["png"] }
# The web page's QR code, drawn with whole device pixels a module (arko's QR crate).
qrcodegen = "1.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Find matches accents however they're written (NFC).
unicode-normalization = "0.1.25"
# The IDs of the background jobs the app asks the engine to stop.
uuid = "1"

[dev-dependencies]
# The same GPUI Kit with GPUI's test harness, for tests that click and type
# into real windows on a fake clock.
gpui-kit = { git = "https://github.com/mesa-hills-research/gpui_kit", rev = "967d3871d8da17fa982d447b758a4af539bf0981", features = ["test-support"] }
arko = { package = "arko-tui", version = "0.7.0", default-features = false, features = ["remote", "testing"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
# The feed's events as arko gets them from the framework, for tests that
# drive a feed the way a session does.
arko_agents = "0.1.8"
arko_workflows = "0.1.6"
# A session's saved conversation, for tests that reopen its transcript.
arko_ai = "0.1.3"

# The golden-screenshot harness, from the gpui repository at the commit the published
# mhr-gpui crates were cut from. Its goldens are drawn by Mesa's software Vulkan driver, on Linux.
[target.'cfg(target_os = "linux")'.dev-dependencies]
gpui-screenshot = { package = "mhr-gpui-screenshot", git = "https://github.com/mesa-hills-research/gpui", rev = "fe44f629c92a8bc3bed38bdd471a6697e0b5f64a" }
# Linux's text system with the system's fonts, for measuring Settings as it opens.
gpui-wgpu = { package = "mhr-gpui-wgpu", version = "=0.1.4" }

[build-dependencies]
winresource = "0.1"

# The screenshot harness is a git dependency, so its mhr-gpui and mhr-gpui-wgpu would be
# second copies. These give it the published crates the kit uses. Keep them at the kit's pin.
[patch."https://github.com/mesa-hills-research/gpui"]
mhr-gpui = "=0.1.4"
mhr-gpui-wgpu = "=0.1.4"

[profile.release]
codegen-units = 1
lto = "thin"

# GPUI's layout, text and drawing crates are slow unoptimized. Optimizing them
# keeps debug builds responsive while the app's own code stays quick to build.
[profile.dev.package]
mhr-gpui = { opt-level = 3 }
mhr-sum-tree = { opt-level = 3 }
resvg = { opt-level = 3 }
ropey = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
