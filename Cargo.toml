[package]
name = "arko_studio"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "The desktop app of the arko agent"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mesa-hills-research/arko_studio"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "arko-studio"
path = "src/main.rs"

[dependencies]
# GPUI Kit from Mesa Hills Research's fork. It pins the matching gpui-pre release
# and re-exports it, so GPUI is `gpui_kit::*` and needs no entry of its own.
gpui-kit = { git = "https://github.com/mesa-hills-research/gpui_kit", rev = "c2c919d85c7095cadf5ef124f02676791240455d" }
anyhow = "1.0"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# The same GPUI Kit with GPUI's test harness, for tests that click and type
# into real windows on a fake clock.
gpui-kit = { git = "https://github.com/mesa-hills-research/gpui_kit", rev = "c2c919d85c7095cadf5ef124f02676791240455d", features = ["test-support"] }
tempfile = "3"

# The golden-screenshot harness, from the gpui fork at the rev of the [patch.crates-io] below.
# Its goldens are drawn by Mesa's software Vulkan driver, on Linux.
[target.'cfg(target_os = "linux")'.dev-dependencies]
gpui-screenshot = { package = "gpui-pre-screenshot", git = "https://github.com/mesa-hills-research/gpui", rev = "3ee85e86ba0c3cffb4275f459de36a47b0b5a6ea" }

[build-dependencies]
winresource = "0.1"

# GPUI from Mesa Hills Research's fork, at the commit GPUI Kit builds with. Cargo applies
# only the app's own patches, so the kit's patch doesn't reach the app. Move the rev with
# the kit's.
[patch.crates-io]
gpui-pre                   = { git = "https://github.com/mesa-hills-research/gpui", rev = "3ee85e86ba0c3cffb4275f459de36a47b0b5a6ea" }
gpui-pre-apple             = { git = "https://github.com/mesa-hills-research/gpui", rev = "3ee85e86ba0c3cffb4275f459de36a47b0b5a6ea" }
gpui-pre-collections       = { git = "https://github.com/mesa-hills-research/gpui", rev = "3ee85e86ba0c3cffb4275f459de36a47b0b5a6ea" }
gpui-pre-derive-refineable = { git = "https://github.com/mesa-hills-research/gpui", rev = "3ee85e86ba0c3cffb4275f459de36a47b0b5a6ea" }
gpui-pre-http-client       = { git = "https://github.com/mesa-hills-research/gpui", rev = "3ee85e86ba0c3cffb4275f459de36a47b0b5a6ea" }
gpui-pre-linux             = { git = "https://github.com/mesa-hills-research/gpui", rev = "3ee85e86ba0c3cffb4275f459de36a47b0b5a6ea" }
gpui-pre-macos             = { git = "https://github.com/mesa-hills-research/gpui", rev = "3ee85e86ba0c3cffb4275f459de36a47b0b5a6ea" }
gpui-pre-macros            = { git = "https://github.com/mesa-hills-research/gpui", rev = "3ee85e86ba0c3cffb4275f459de36a47b0b5a6ea" }
gpui-pre-perf              = { git = "https://github.com/mesa-hills-research/gpui", rev = "3ee85e86ba0c3cffb4275f459de36a47b0b5a6ea" }
gpui-pre-platform          = { git = "https://github.com/mesa-hills-research/gpui", rev = "3ee85e86ba0c3cffb4275f459de36a47b0b5a6ea" }
gpui-pre-refineable        = { git = "https://github.com/mesa-hills-research/gpui", rev = "3ee85e86ba0c3cffb4275f459de36a47b0b5a6ea" }
gpui-pre-scheduler         = { git = "https://github.com/mesa-hills-research/gpui", rev = "3ee85e86ba0c3cffb4275f459de36a47b0b5a6ea" }
gpui-pre-shared-string     = { git = "https://github.com/mesa-hills-research/gpui", rev = "3ee85e86ba0c3cffb4275f459de36a47b0b5a6ea" }
gpui-pre-sum-tree          = { git = "https://github.com/mesa-hills-research/gpui", rev = "3ee85e86ba0c3cffb4275f459de36a47b0b5a6ea" }
gpui-pre-util              = { git = "https://github.com/mesa-hills-research/gpui", rev = "3ee85e86ba0c3cffb4275f459de36a47b0b5a6ea" }
gpui-pre-util-macros       = { git = "https://github.com/mesa-hills-research/gpui", rev = "3ee85e86ba0c3cffb4275f459de36a47b0b5a6ea" }
gpui-pre-web               = { git = "https://github.com/mesa-hills-research/gpui", rev = "3ee85e86ba0c3cffb4275f459de36a47b0b5a6ea" }
gpui-pre-wgpu              = { git = "https://github.com/mesa-hills-research/gpui", rev = "3ee85e86ba0c3cffb4275f459de36a47b0b5a6ea" }
gpui-pre-windows           = { git = "https://github.com/mesa-hills-research/gpui", rev = "3ee85e86ba0c3cffb4275f459de36a47b0b5a6ea" }
gpui-pre-zlog              = { git = "https://github.com/mesa-hills-research/gpui", rev = "3ee85e86ba0c3cffb4275f459de36a47b0b5a6ea" }
gpui-pre-ztracing          = { git = "https://github.com/mesa-hills-research/gpui", rev = "3ee85e86ba0c3cffb4275f459de36a47b0b5a6ea" }
gpui-pre-ztracing-macro    = { git = "https://github.com/mesa-hills-research/gpui", rev = "3ee85e86ba0c3cffb4275f459de36a47b0b5a6ea" }

[profile.release]
codegen-units = 1
lto = "thin"

# GPUI's layout, text and drawing crates are slow unoptimized. Optimizing them
# keeps debug builds responsive while the app's own code stays quick to build.
[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-pre-sum-tree = { opt-level = 3 }
resvg = { opt-level = 3 }
ropey = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
