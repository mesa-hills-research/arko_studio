[package]
name = "arko_studio"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "The desktop app of the arko agent"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mesa-hills-research/arko_studio"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "arko-studio"
path = "src/main.rs"

[dependencies]
# GPUI Kit, Mesa Hills Research's fork, published as the `mhr-gpui-kit` crates. It pins the
# matching mhr-gpui release and re-exports it, so GPUI is `gpui_kit::*` and needs no entry of
# its own.
gpui-kit = { package = "mhr-gpui-kit", version = "=0.7.3", features = ["fonts", "tree-sitter-languages", "writing"] }
# Arko's engine, as a library: no terminal crates, the web page's server kept.
arko = { package = "arko-tui", version = "0.13.0", default-features = false, features = ["remote"] }
anyhow = "1.0"
# arko's Prompter trait is an async trait.
async-trait = "0.1"
# Find folds case in full (Unicode's case folding table).
caseless = "0.2.2"
chrono = "0.4"
# Lists an agent's folder for @-mentions as git sees it (.gitignore and the like).
ignore = "0.4"
# The user's time zone and what it calls the time ("MDT", "MST"), which chrono can't name. It
# finds the zone on Linux, macOS and Windows, and reads the system's time zone database (a bundled
# copy on Windows).
jiff = "0.2"
# Parse fragment boundaries before joining replies in an export.
markdown = "1"
# The pixels of images the app draws itself, and the PNG of the window icon on Linux (GPUI's
# own version, with the PNG codec it already uses).
image = { version = "0.25", default-features = false, features = ["png"] }
# The web page's QR code, drawn with whole device pixels a module (arko's QR crate).
qrcodegen = "1.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Find matches accents however they're written (NFC).
unicode-normalization = "0.1.25"
# The IDs of the background jobs the app asks the engine to stop.
uuid = "1"

[dev-dependencies]
# The same GPUI Kit with GPUI's test harness, for tests that click and type
# into real windows on a fake clock.
gpui-kit = { package = "mhr-gpui-kit", version = "=0.7.3", features = ["test-support"] }
arko = { package = "arko-tui", version = "0.13.0", default-features = false, features = ["remote", "testing"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
# The feed's events as arko gets them from the framework, for tests that
# drive a feed the way a session does.
arko_agents = "0.3.0"
arko_workflows = "0.4.0"
# A session's saved conversation, for tests that reopen its transcript.
arko_ai = "0.2.2"
# The time zone database built in, so tests of times in a named zone pass on any machine.
jiff = { version = "0.2", features = ["tzdb-bundle-always"] }

# The golden-screenshot harness, at the kit's mhr-gpui release. Its goldens are drawn by Mesa's
# software Vulkan driver, on Linux.
[target.'cfg(target_os = "linux")'.dev-dependencies]
gpui-screenshot = { package = "mhr-gpui-screenshot", version = "=0.1.6" }
# Linux's text system with the system's fonts, for measuring Settings as it opens.
gpui-wgpu = { package = "mhr-gpui-wgpu", version = "=0.1.6" }

[build-dependencies]
winresource = "0.1"

[profile.release]
codegen-units = 1
lto = "thin"

# GPUI's layout, text and drawing crates are slow unoptimized. Optimizing them
# keeps debug builds responsive while the app's own code stays quick to build.
[profile.dev.package]
mhr-gpui = { opt-level = 3 }
mhr-sum-tree = { opt-level = 3 }
resvg = { opt-level = 3 }
ropey = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
